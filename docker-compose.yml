version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attestr_backend
    ports:
      - "8000:8000"
    volumes:
      # Live reload: mount source so changes reflect immediately
      - ./backend:/app
      # Persist the SQLite database and keystore outside the container
      - attestr_data:/app/data
    environment:
      - ATTESTR_ENV=development
      - DATABASE_URL=sqlite:////app/data/attestr.db
      - CA_KEYSTORE_PATH=/app/data/ca_keystore.json
      - CA_PASSPHRASE=dev-passphrase-change-in-production
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attestr_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  # Local fake SMTP — catches all outgoing emails in a browser UI
  mailhog:
    image: mailhog/mailhog
    container_name: attestr_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → open http://localhost:8025

volumes:
  attestr_data:
